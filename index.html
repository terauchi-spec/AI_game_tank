<style>

@media (pointer:coarse){
 html,body{width:100%;height:100%;overflow:hidden;background:#000}

 canvas{position:fixed;inset:0;width:100vw;height:100dvh;max-width:none;max-height:none;border:0;border-radius:0;display:block}

 #resetBtn{top:max(8px,calc(env(safe-area-inset-top,0px) + 6px));left:max(8px,calc(env(safe-area-inset-left,0px) + 6px));width:40px;height:40px;border-radius:11px;font-size:20px}

<body>
<canvas id="c" width="840" height="680"></canvas>
<button id="resetBtn" type="button" aria-label="タイトルへ戻る" title="タイトルへ戻る">⌂</button>
<button id="debugToggleBtn" type="button" aria-label="無敵モード切替" title="無敵モード切替"><span class="icon">🛡</span><span class="key">P</span></button>

<div id="pad"><div id="stick"><div id="knob"></div></div><div class="btns"><button class="b" id="skillBtn" data-k="KeyS"><span class="coolRing" id="skillCooldown"></span><span class="coolText" id="skillCooldownText"></span><b>S</b><small id="skillLabel">スキル</small></button><button class="b" id="actionBtn" type="button"><span class="coolRing" id="actionCooldown"></span><span class="coolText" id="actionCooldownText"></span><b id="actionGlyph">D</b><small id="actionLabel">爆弾</small></button><button class="b" data-k="KeyE"><b>E</b><small>操作</small></button></div></div>
<p>移動: ↑↓←→ / E: 搭乗・降車・近接気絶 / 再開: Enter<br>歩兵: D=爆弾設置/起爆　S=スキル　E=近くの敵兵を10秒気絶　戦車: D=主砲、S=マシンガン（車種で性能差）　戦闘機: D=爆撃　スマホ戦車: Dドラッグで照準→離して主砲、S長押し＋ドラッグでMG照準</p>
<script>
const cv=document.getElementById('c'),gm=cv.getContext('2d'),oc=document.createElement('canvas'),MOBILE_VIEW=matchMedia('(pointer:coarse)').matches,W=MOBILE_VIEW?480:840,H=MOBILE_VIEW?Math.max(680,Math.round(W*((window.visualViewport&&visualViewport.height)||innerHeight)/Math.max(1,((window.visualViewport&&visualViewport.width)||innerWidth)))):680,WH=12800,WW=960;const MAP_SCALE=4;cv.width=W;cv.height=H;oc.width=W/2;oc.height=Math.ceil(H/2);const og=oc.getContext('2d');let g=gm;
const GAME_VERSION='2026.10.05.98',FILE_CREATED_AT='2026/10/06 23:24',DRILL_ACTIVE=5,DRILL_RECHARGE=6;
let audioCtx=null;
function ensureAudio(){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}catch(_){}}
function tone(f=440,d=.08,v=.035,type='square',f2=null){if(!audioCtx)return;const t=audioCtx.currentTime,o=audioCtx.createOscillator(),a=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);a.gain.setValueAtTime(v,t);a.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(a);a.connect(audioCtx.destination);o.start(t);o.stop(t+d+.02);}
function noise(d=.12,v=.025){if(!audioCtx)return;const sr=audioCtx.sampleRate,n=Math.max(1,Math.floor(sr*d)),buf=audioCtx.createBuffer(1,n,sr),ch=buf.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const src=audioCtx.createBufferSource(),a=audioCtx.createGain();src.buffer=buf;a.gain.value=v;src.connect(a);a.connect(audioCtx.destination);src.start();}
function sfx(n){ensureAudio();if(!audioCtx)return;switch(n){case'cannon':tone(105,.14,.065,'sawtooth',45);noise(.18,.045);break;case'mg':tone(250,.045,.018,'square',150);break;case'explosion':tone(80,.22,.055,'sawtooth',32);noise(.28,.055);break;case'airExplosion':tone(80,.22,.033,'sawtooth',32);noise(.28,.033);break;case'pickup':tone(620,.08,.03,'sine',900);setTimeout(()=>tone(900,.09,.025,'sine',1200),65);break;case'skill':tone(420,.1,.025,'triangle',650);break;case'drill':tone(145,.07,.02,'sawtooth',110);break;case'drillBreak':noise(.2,.045);tone(120,.13,.04,'square',55);break;case'ally':tone(520,.08,.025,'triangle',720);setTimeout(()=>tone(720,.1,.025,'triangle',980),70);break;case'radio':tone(880,.05,.018,'square');setTimeout(()=>tone(660,.05,.018,'square'),80);setTimeout(()=>tone(980,.08,.02,'square'),160);break;case'enter':tone(280,.07,.022,'triangle',420);break;case'rain':noise(.35,.012);break;case'enemyCannon':tone(88,.11,.028,'sawtooth',50);noise(.11,.018);break;case'enemyGun':tone(190,.04,.009,'square',130);break;case'lose':tone(180,.18,.035,'sawtooth',75);setTimeout(()=>tone(120,.28,.025,'sawtooth',45),120);break;case'win':tone(440,.12,.03,'triangle',660);setTimeout(()=>tone(660,.16,.03,'triangle',990),120);break;case'crush':tone(120,.055,.022,'square',70);noise(.07,.022);break;case'vehicleHit':tone(210,.05,.018,'square',120);noise(.045,.012);break;case'decoy':tone(760,.06,.018,'square',1020);setTimeout(()=>tone(1020,.05,.014,'square',760),70);break;case'splash':noise(.09,.016);tone(190,.06,.012,'triangle',130);break;case'deathHit':tone(95,.18,.05,'sawtooth',42);noise(.22,.04);break;case'bombdrop':tone(330,.18,.018,'sine',120);setTimeout(()=>noise(.06,.01),100);break;}}
addEventListener('pointerdown',ensureAudio,{passive:true});addEventListener('keydown',ensureAudio,{passive:true});
const keys={};let mx=240,my=300,mdown=false,bombReq=false,cannonReq=false,interact=false;
const normKeyCode=e=>{
 const k=(e.key||'').toLowerCase(),kc=e.keyCode||e.which||0,c=e.code||'';
 // 同時押し時に code が Unidentified になっても文字/キーコードから復元する。
 if(c==='KeyD'||k==='d'||kc===68)return'KeyD';
 if(c==='KeyS'||k==='s'||kc===83)return'KeyS';
 if(c==='KeyE'||k==='e'||kc===69)return'KeyE';
 if(c)return c;
 return e.key||'';
};
let dPressHandled=false,dLastFallback=0;
function queueDAction(){
 const now=performance.now();
 if(now-dLastFallback<55)return;
 dLastFallback=now;dPressHandled=true;
 if(p&&p.tank)cannonReq=true;else bombReq=true;
}
addEventListener('keydown',e=>{
 const code=normKeyCode(e);
 if(code.startsWith('Arrow')||code==='Space')e.preventDefault();
 const first=!keys[code];keys[code]=true;
 // Dは移動キーとは完全に独立したアクションとして扱う。
 if(code==='KeyD'&&!e.repeat)queueDAction();
 if(code==='KeyE'&&first&&!e.repeat)interact=true;
 if(code==='KeyS'&&!(p&&p.tank)&&first&&!e.repeat)skillReq=true;
 if(code==='KeyP'&&state==='play'&&first&&!e.repeat)toggleDebugInvincible();
 if(code==='KeyO'&&state==='play'&&first&&!e.repeat)spawnAreaDebugTankAhead();
 if(e.repeat)return;
 if(code==='Enter'){
  if(state==='title'){rollSkillChoices();state='skill';}
  else if(state==='help')state='title';
  else if(state==='win'||state==='lose'){rollSkillChoices();state='skill';bombReq=false;cannonReq=false;interact=false;skillReq=false;}
 }
 if(code==='KeyH'&&state==='title'){state='help';}
 if(code==='Escape'&&state==='help'){state='title';}
 if(code==='Escape'&&(state==='win'||state==='lose')){state='title';bombReq=false;cannonReq=false;interact=false;skillReq=false;}
 if(state==='skill'&&/^[12345678]$/.test(e.key))chooseSkillByNumber(+e.key);
},true);
// 一部キーボードでは3キー同時押し時にkeydownだけ欠落するため、keypressも予備経路にする。
addEventListener('keypress',e=>{
 const code=normKeyCode(e);
 if(code==='KeyD'&&!dPressHandled)queueDAction();
},true);
addEventListener('keyup',e=>{
 const code=normKeyCode(e);
 // keydown/keypressが届かずkeyupだけ届いたケースでも、D操作を1回だけ実行。
 if(code==='KeyD'){
  if(!dPressHandled)queueDAction();
  dPressHandled=false;
 }
 keys[code]=false;
},true);
cv.addEventListener('mousemove',e=>{lastMouse=performance.now();const r=cv.getBoundingClientRect();mx=(e.clientX-r.left)*W/r.width;my=(e.clientY-r.top)*H/r.height;});
function canvasPoint(e){const r=cv.getBoundingClientRect();mx=(e.clientX-r.left)*W/r.width;my=(e.clientY-r.top)*H/r.height;}
cv.addEventListener('pointermove',e=>{canvasPoint(e);if(e.pointerType==='mouse')lastMouse=performance.now();});
cv.addEventListener('pointerdown',e=>{e.preventDefault();canvasPoint(e);if(e.pointerType==='mouse')lastMouse=performance.now();mdown=true;
 try{cv.setPointerCapture(e.pointerId);}catch(_){}
 if(state==='title'){handleTitlePointer(mx,my);mdown=false;}else if(state==='help'){handleHelpPointer(mx,my);mdown=false;}else if(state==='skill'){handleSkillMenuPointer(mx,my);mdown=false;}
 else if(state==='win'||state==='lose'){handleResultPointer(mx,my);}});
const canvasUp=()=>{mdown=false;};cv.addEventListener('pointerup',canvasUp);cv.addEventListener('pointercancel',canvasUp);addEventListener('pointerup',canvasUp);

// 戦車性能: cmax=砲弾数, vmax=MG弾数, sp=速度, fmax=燃料容量,
// crng=主砲射程, ccd=主砲装填時間, armor=耐久。主要性能差は最大2倍以内。
// プレイヤーが使用できる戦車の燃料容量は従来値の1.3倍。
const PLAYER_TANK_FUEL_SCALE=1.3;
const TYPES=[
 {id:'t34',n:'T-34(ソ連)',hp:8,armor:1.35,cmax:11,vmax:72,fmax:81*PLAYER_TANK_FUEL_SCALE,sp:99,cdmg:2.7,ccd:2.42,cspd:558,crng:504,vcd:.165,col:'#556a34'},
 {id:'tiger',n:'Tiger I(独)',hp:16,armor:2.0,cmax:9,vmax:54,fmax:72*PLAYER_TANK_FUEL_SCALE,sp:72,cdmg:5.4,ccd:3.08,cspd:648,crng:684,vcd:.22,col:'#8f8666'},
 {id:'type10',n:'10式(日)',hp:12,armor:1.55,cmax:14,vmax:90,fmax:117*PLAYER_TANK_FUEL_SCALE,sp:126,cdmg:3.6,ccd:1.65,cspd:630,crng:630,vcd:.121,col:'#4e6350'},
 {id:'m1',n:'M1 エイブラムス(米)',hp:15,armor:1.8,cmax:13,vmax:108,fmax:126*PLAYER_TANK_FUEL_SCALE,sp:113,cdmg:4.5,ccd:1.87,cspd:720,crng:738,vcd:.11,col:'#a78957'}];
const TRUCK_TYPE={id:'truck',n:'トラック',hp:5,fmax:100,sp:217.5,cdmg:0,ccd:1,cspd:0,crng:0,vcd:1,col:'#65705a'};
const FIGHTER_TYPE={id:'fighter',n:'戦闘機',hp:8,fmax:100,sp:260,cdmg:0,ccd:2.2,cspd:0,crng:0,vcd:1,col:'#64788f'};
const ZONE_STYLE={

 '村':{g:'#6a6040',p:['#5a5236','#7a7048','#867850','#5f553a']},

// 画像は index.html と同じ場所の assets/ フォルダから読み込む（旧版はbase64で埋め込み）。

const TERRAIN_IMG={},COVER_IMG={};
const RIVER_CACHE_SCALE=.5,RIVER_BANK_PAD=36;let riverSurfaceVersion=1;
let assetLoadTotal=0,assetLoadDone=0,assetLoadFailed=0,assetLoadStart=0,assetInitStarted=false;
function makeAssetImage(src,onload){

 let finished=false;
 const finish=ok=>{if(finished)return;finished=true;assetLoadDone++;if(!ok)assetLoadFailed++;if(ok&&onload)onload();};

   const bw=112+R()*10,bh=80+R()*9,gx=76,gy=12,startX=18+R()*8,startY=top+5+R()*4;
   let row=0;for(let y=startY;y<bottom-30;y+=26,row++){
    const shift=(row%2)*(gx*.45);let col=0;
    for(let x=startX+shift;x+bw<WW-14;x+=bw+gx,col++){
     if((row+col)%9===4&&R()<.5)continue;
     const rr=R();
     tryAdd(rr<.68?3:rr<.80?4:rr<.90?9:10,x,y,bw+R()*14,bh+R()*14,5,8);
    }
   }
   for(let k=0;k<20;k++)tryAdd(7,28+R()*860,ry(),46+R()*18,22+R()*10,5,18);
  }else if(z.n==='敵前線基地'){
   // 軍事施設、コンクリート障害物、柵が多い。
   for(let k=0;k<10;k++){const w=118+R()*16,h=84+R()*14;tryAdd(R()<.55?3:7,42+R()*(WW-w-84),ry(),w,h,16,16);}
   for(let k=0;k<6;k++){const w=82+R()*18,h=72+R()*16;tryAdd(9,42+R()*(WW-w-84),ry(),w,h,14,18);}
   for(let k=0;k<18;k++){if(R()<.5)tryAdd(1,36+R()*850,ry(),72+R()*42,12,6);else tryAdd(1,36+R()*850,ry(),12,58+R()*38,6);}
  }else if(z.n==='敵迷路基地'){
   // 細かいセルの高密度迷路。壁同士を重ねて接続し、角の微小な隙間から索敵されないようにする。
   const C=15,csx=62,csy=18,Rr=Math.max(12,Math.floor((bottom-top)/csy)),mx0=15,my0=top+6,wt=16,yHalf=wt/(2*MAP_SCALE);
   const V=Array.from({length:C+1},()=>Array(Rr).fill(1)),Hh=Array.from({length:C},()=>Array(Rr+1).fill(1)),sn=Array.from({length:C},()=>Array(Rr).fill(0));
   let st=[[R()*C|0,R()*Rr|0]];sn[st[0][0]][st[0][1]]=1;
   while(st.length){
    const [i,j]=st[st.length-1],nb=[[1,0],[-1,0],[0,1],[0,-1]].map(([a,b])=>[i+a,j+b,a,b]).filter(([a,b])=>a>=0&&a<C&&b>=0&&b<Rr&&!sn[a][b]);
    if(!nb.length){st.pop();continue;}
    const [a,b,da,db]=nb[R()*nb.length|0];sn[a][b]=1;if(da===1)V[i+1][j]=0;else if(da===-1)V[i][j]=0;else if(db===1)Hh[i][j+1]=0;else Hh[i][j]=0;st.push([a,b]);
   }
   // 少量だけ壁を抜き、一本道ではないが読み解きが必要な迷路にする。
   for(let i=1;i<C;i++)for(let j=0;j<Rr;j++)if(V[i][j]&&R()<.07)V[i][j]=0;
   for(let i=0;i<C;i++)for(let j=1;j<Rr;j++)if(Hh[i][j]&&R()<.07)Hh[i][j]=0;
   const entry=1+(R()*(C-2)|0),exit=1+(R()*(C-2)|0),left=1+(R()*Math.max(1,Rr-2)|0),right=1+(R()*Math.max(1,Rr-2)|0);
   Hh[entry][Rr]=0;Hh[exit][0]=0;V[0][left]=0;V[C][right]=0;
   const mazeWall=(x,y,w,h)=>{
    const c={kd:1,x,y,w,h,mazeWall:1},fy=y*MAP_SCALE,ft=top*MAP_SCALE,fb=bottom*MAP_SCALE;
    if(x<2||x+w>WW-2||fy<ft-6||fy+h>fb+6||water.some(o=>ovF(o,c,4))||bridges.some(o=>ovF(o,c,28)))return false;
    covers.push(c);return true;
   };
   // Yは後で4倍されるため、縦セル間隔だけ旧座標系で圧縮。最終画面ではほぼ正方形の細かな迷路になる。
   for(let i=0;i<=C;i++)for(let j=0;j<Rr;j++)if(V[i][j])mazeWall(mx0+i*csx-wt/2,my0+j*csy-yHalf,wt,csy*MAP_SCALE+wt);
   for(let i=0;i<C;i++)for(let j=0;j<=Rr;j++)if(Hh[i][j])mazeWall(mx0+i*csx-wt/2,my0+j*csy-yHalf,csx+wt,wt);
   // 壁の交点を柱で塞ぎ、斜め方向の微小な索敵抜けも防止。
   for(let i=0;i<=C;i++)for(let j=0;j<=Rr;j++){
    const has=(j<Rr&&V[i]?.[j])||(j>0&&V[i]?.[j-1])||(i<C&&Hh[i]?.[j])||(i>0&&Hh[i-1]?.[j]);
    if(has)mazeWall(mx0+i*csx-wt/2,my0+j*csy-yHalf,wt,wt);
   }
   // 迷路基地は建物を置かず、迷路壁と防護壁だけで構成する。
   for(let k=0;k<8;k++){
    const w=98+R()*20,h=24+R()*8;
    tryAdd(7,36+R()*(WW-w-72),ry(),w,h,8,14);
   }
  }else if(z.n==='敵司令本部'){
   // 正面は広場として空け、左右と奥だけに遮蔽物を置く。
   const plazaL=WW/2-230,plazaR=WW/2+230,plazaTop=Math.max(top,base.y+base.h+80),plazaBottom=Math.min(bottom,plazaTop+250);
   for(let k=0;k<12;k++){const side=R()<.5?0:1,x=side?plazaR+20+R()*Math.max(20,WW-plazaR-100):28+R()*Math.max(20,plazaL-110);tryAdd(R()<.55?1:7,x,plazaTop+R()*Math.max(40,plazaBottom-plazaTop),68+R()*28,18+R()*16,12);}

function genObjects(){
 objects=[];
 const overlap=(a,b,m=0)=>a.x<b.x+b.w+m&&a.x+a.w+m>b.x&&(a.y*MAP_SCALE)<(b.y*MAP_SCALE+b.h+m)&&(a.y*MAP_SCALE+a.h+m)>(b.y*MAP_SCALE);
 // 配置時は見た目の外形を基準に、遮蔽物・オブジェクト同士の重なりを防ぐ。
 const objectPlaceRect=o=>{
  if(o.kind==='barrel'){
   const dw=o.w*1.30,dh=o.h*1.76,cx=o.x+o.w/2,topActual=o.y*MAP_SCALE+o.h*.93-dh;
   return{x:cx-dw/2,y:topActual/MAP_SCALE,w:dw,h:dh};
  }
  const dw=o.w*1.02,dh=o.h*1.02,cx=o.x+o.w/2,cyActual=o.y*MAP_SCALE+o.h/2;
  return{x:cx-dw/2,y:(cyActual-dh/2)/MAP_SCALE,w:dw,h:dh};
 };
 const coverPlaceRect=c=>{
  const actual={...c,y:c.y*MAP_SCALE},rc=coverFragmentRect(actual)||{x:actual.x,y:actual.y,w:actual.w,h:actual.h};
  // 画像未読込時でも安全側になるよう、論理外形と描画外形の両方を包む矩形にする。
  const x1=Math.min(actual.x,rc.x),y1=Math.min(actual.y,rc.y),x2=Math.max(actual.x+actual.w,rc.x+rc.w),y2=Math.max(actual.y+actual.h,rc.y+rc.h);
  return{x:x1,y:y1/MAP_SCALE,w:x2-x1,h:y2-y1};
 };
 const addObject=(kind,x,y,w,h,m=8)=>{const o={kind,x,y,w,h},or=objectPlaceRect(o);if(or.x<0||or.x+or.w>WW||or.y<0||or.y>WH/MAP_SCALE||objects.some(q=>overlap(objectPlaceRect(q),or,m))||covers.some(c=>overlap(coverPlaceRect(c),or,m))||water.some(q=>overlap(q,or,8))||(mud||[]).some(q=>overlap(q,or,5))||bushes.some(q=>overlap(q,or,5))||nearBridge(or,65)||overlap(or,base,28)||overlap({x:350,y:2990,w:260,h:170},or,0))return false;objects.push(o);return true;};
 const tryObject=(kind,x,y,w,h,m=8,tries=18)=>{for(let i=0;i<tries;i++)if(addObject(kind,x+(R()-.5)*30,y+(R()-.5)*24,w,h,m))return true;return false;};
 const bands=ZONES.map(z=>({n:z.n,y0:z.y0/MAP_SCALE,y1:Math.max(0,z.y1/MAP_SCALE)}));
 for(const z of bands){const top=z.y1+24,bottom=z.y0-24,span=Math.max(90,bottom-top),ry=()=>top+R()*span;
  if(z.n==='草原'){for(let k=0;k<16;k++)tryObject('crate',35+R()*850,ry(),CRATE_W,CRATE_H,9);}
  else if(z.n==='湿地'){for(let k=0;k<4;k++)tryObject('crate',45+R()*830,ry(),CRATE_W,CRATE_H,10);for(let k=0;k<5;k++)tryObject('barrel',42+R()*836,ry(),BARREL_SIZE,BARREL_SIZE,8);}
  else if(z.n==='村'){for(let k=0;k<6;k++)tryObject('crate',34+R()*850,ry(),CRATE_W,CRATE_H,8);for(let k=0;k<8;k++)tryObject('barrel',40+R()*840,ry(),BARREL_SIZE,BARREL_SIZE,7);}
  else if(z.n==='街'){for(let k=0;k<6;k++)tryObject('barrel',36+R()*850,ry(),BARREL_SIZE,BARREL_SIZE,7);for(let k=0;k<6;k++)tryObject('crate',40+R()*840,ry(),CRATE_W,CRATE_H,9);}
  else if(z.n==='敵前線基地'){for(let k=0;k<7;k++)tryObject('crate',40+R()*840,ry(),CRATE_W,CRATE_H,9);for(let k=0;k<6;k++)tryObject('barrel',36+R()*850,ry(),BARREL_SIZE,BARREL_SIZE,7);}
  else if(z.n==='敵迷路基地'){for(let k=0;k<5;k++)tryObject('crate',40+R()*840,ry(),CRATE_W,CRATE_H,9);}
  else if(z.n==='敵司令本部'){for(let k=0;k<10;k++)tryObject('crate',40+R()*840,ry(),CRATE_W,CRATE_H,10);for(let k=0;k<10;k++)tryObject('barrel',40+R()*840,ry(),BARREL_SIZE,BARREL_SIZE,8);}
 }
}

function carve(x,y,r,credit=false,objectDamageSource='impact'){
 if(objectDamageSource)damageObjectsInRadius(x,y,r,objectDamageSource);
 const out=[];let removedArea=0,cannonDebris=[];
 for(const c of covers){
  // Damage checks use the visible fragment/sprite bounds; collision is handled separately below.
  const visual=c.fr?{x:c.x,y:c.y,w:c.w,h:c.h}:coverFragmentRect(c);
  if(!visual||visual.x>x+r||visual.x+visual.w<x-r||visual.y>y+r||visual.y+visual.h<y-r){out.push(c);continue;}
  if(c.fr){
   const fd=Math.hypot(c.x+c.w/2-x,c.y+c.h/2-y);
   if(fd>r){
    if(fd<=r+Math.max(c.w,c.h)*1.15)c.edge=1;
    out.push(c);
   }else{removedArea+=c.w*c.h;if(objectDamageSource==='cannonBlast')cannonDebris.push({x:c.x+c.w/2,y:c.y+c.h/2,col:c.col||CCol[c.kd]||'#8a7a55',n:1});}
   continue;
  }

  // Capture the intact collider before splitting. Visual tiles outside this shape remain drawable,
  // but are marked noHit so destruction can never make the collision larger than it was intact.
  const srcRect=coverHitRect(c),srcCircle=coverHitCircle(c),srcEllipse=rockHitEllipse(c);
  const fr=coverFragmentRect(c);
  const pal=FRAG_COLORS[c.kd]||[CCol[c.kd]||'#8a7a55'],tile=14,ox=fr.x,oy=fr.y,ow=fr.w,oh=fr.h;
  let keptArea=0;
  for(let a=ox;a<ox+ow;a+=tile)for(let b=oy;b<oy+oh;b+=tile){
   const w=Math.min(tile,ox+ow-a),h=Math.min(tile,oy+oh-b),mx=a+w/2,my=b+h/2,dist=Math.hypot(mx-x,my-y);
   if(dist<=r)continue;
   keptArea+=w*h;
   const rx=(a-ox)/Math.max(1,ow),ry=(b-oy)/Math.max(1,oh),idx=((a/tile|0)+(b/tile|0))%pal.length;
   const edge=dist<=r+tile*1.1;
   const f={fr:1,kd:c.kd,x:a,y:b,w,h,col:pal[idx],rx,ry,ow,oh,ox0:c.x,oy0:c.y,ow0:c.w,oh0:c.h,pb:c.playerBuilt?1:0,edge:edge?1:0};

   if(srcEllipse){
    const dx=(mx-srcEllipse.x)/srcEllipse.rx,dy=(my-srcEllipse.y)/srcEllipse.ry,dn=Math.hypot(dx,dy);
    if(dn>=1)f.noHit=1;
    else{
     // Conservative circle entirely inside the original ellipse; this prevents the rock collider
     // from becoming rectangular/larger after the first hit.
     const margin=Math.min(srcEllipse.rx,srcEllipse.ry)*(1-dn);
     f.hcx=mx;f.hcy=my;f.hr=Math.max(.8,Math.min(Math.min(w,h)*.46,margin*.92));
    }
   }else if(srcCircle){
    const margin=srcCircle.r-Math.hypot(mx-srcCircle.x,my-srcCircle.y);
    if(margin<=0)f.noHit=1;
    else{f.hcx=mx;f.hcy=my;f.hr=Math.max(.8,Math.min(Math.min(w,h)*.46,margin*.94));}
   }else if(srcRect){
    const hx=Math.max(a,srcRect.x),hy=Math.max(b,srcRect.y),hx2=Math.min(a+w,srcRect.x+srcRect.w),hy2=Math.min(b+h,srcRect.y+srcRect.h);
    if(hx2<=hx||hy2<=hy)f.noHit=1;
    else{f.hx=hx;f.hy=hy;f.hw=hx2-hx;f.hh=hy2-hy;}
   }else f.noHit=1;
   out.push(f);
  }
  const removedHere=Math.max(0,ow*oh-keptArea);removedArea+=removedHere;if(removedHere>0&&objectDamageSource==='cannonBlast')cannonDebris.push({x,y,col:(FRAG_COLORS[c.kd]||[CCol[c.kd]||'#8a7a55'])[0],n:Math.max(2,Math.min(6,Math.round(removedHere/2600)))});
 }
 covers=out;
 if(removedArea>0&&objectDamageSource==='cannonBlast')for(const d of cannonDebris)cannonCoverDebris(d.x,d.y,d.col,d.n);
 if(credit&&scoreStats&&!scoreStats.finalized)scoreStats.coverDestroyed+=removedArea;
 return removedArea;
}

function baseDamageCanvas(){

 const c=document.createElement('canvas');c.width=Math.max(1,Math.round(b.w));c.height=Math.max(1,Math.round(b.h));
 const q=c.getContext('2d');q.imageSmoothingEnabled=true;q.drawImage(im,0,0,c.width,c.height);
 const md=Math.max(c.width,c.height);
 if(b.holes&&b.holes.length){
  q.save();q.globalCompositeOperation='destination-out';
  for(const h of b.holes){
   const hx=c.width*h.rx,hy=c.height*h.ry,rr=Math.max(7,h.rr*md);

  }

  q.save();q.globalCompositeOperation='source-atop';
  for(const h of b.holes){
   const hx=c.width*h.rx,hy=c.height*h.ry,rr=Math.max(7,h.rr*md);

  }

 }

}

   if(state==='play')near=update(dt);else if(state==='blast')blastUpdate(dt);else if(state==='dying')dyingUpdate(dt);

<script>
(function(){
// iPhone Chrome/Safari: synthetic KeyboardEvent に依存せず、ゲーム内部の入力状態を直接更新する。
const press=(c)=>{
 if(keys[c]) return;
 keys[c]=true;
 if(c==='KeyD'){if(p&&p.tank)cannonReq=true;else bombReq=true;}
 if(c==='KeyE')interact=true;
 if(c==='KeyS'&&!(p&&p.tank))skillReq=true;
};
const release=(c)=>{keys[c]=false;};
const cap=(el,e)=>{try{el.setPointerCapture(e.pointerId);}catch(_){}};
const debugToggleBtn=document.getElementById('debugToggleBtn');
const debugModeLabel=()=>debugMode===1?'無敵モード':debugMode===2?'無敵＋索敵解除':debugMode===3?'無敵＋戦闘機∞燃料':'無敵モード OFF';
if(debugToggleBtn){
 const syncDebugToggleButton=()=>{
  const active=debugMode>0,playable=state==='play';
  debugToggleBtn.classList.toggle('on',active);
  debugToggleBtn.setAttribute('aria-pressed',active?'true':'false');
  debugToggleBtn.setAttribute('aria-label',playable?('Pキー相当：'+debugModeLabel()):'無敵モード切替（プレイ中のみ）');
  debugToggleBtn.title=playable?('Pキー相当：'+debugModeLabel()):'無敵モード切替（プレイ中のみ）';
  debugToggleBtn.style.opacity=playable?'1':'.5';
 };
 debugToggleBtn.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();},{passive:false});
 debugToggleBtn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(state!=='play')return;toggleDebugInvincible();syncDebugToggleButton();});
 syncDebugToggleButton();
 setInterval(syncDebugToggleButton,250);
}

document.querySelectorAll('[data-k]').forEach(el=>{const c=el.dataset.k;
 const down=e=>{e.preventDefault();cap(el,e);el.classList.add('on');press(c);};
 const up=e=>{if(e)e.preventDefault();el.classList.remove('on');release(c);};
 el.addEventListener('pointerdown',down,{passive:false});
 el.addEventListener('pointerup',up,{passive:false});
 el.addEventListener('pointercancel',up,{passive:false});
 el.addEventListener('lostpointercapture',up,{passive:false});
});

// D/S/E操作: D=爆弾/主砲/爆撃、S=スキル/MG、E=搭乗/降車。
const actionBtn=document.getElementById('actionBtn'),actionGlyph=document.getElementById('actionGlyph'),actionLabel=document.getElementById('actionLabel'),actionCooldown=document.getElementById('actionCooldown'),actionCooldownText=document.getElementById('actionCooldownText');
const skillBtn=document.getElementById('skillBtn'),skillLabel=document.getElementById('skillLabel'),skillCooldown=document.getElementById('skillCooldown'),skillCooldownText=document.getElementById('skillCooldownText');
let actionKey=null,lastActionMode='',lastActionUiFrame=0,lastActionLabel='',lastSkillLabel='';
const paintRing=(el,rem,max)=>{const ratio=Math.max(0,Math.min(1,rem/Math.max(.01,max))),deg=ratio*360;el.style.background='conic-gradient(#ffd27a '+deg+'deg, rgba(255,255,255,.13) '+deg+'deg)';el.classList.toggle('on',rem>.02);};
const syncActionButton=()=>{
 const now=performance.now();if(now-lastActionUiFrame<45)return;lastActionUiFrame=now;
 const truckMode=!!(p&&p.tank&&p.tank.kind==='truck'),fighterMode=!!(p&&p.tank&&p.tank.kind==='fighter'),tankMode=!!(p&&p.tank&&p.tank.kind==='tank'),planted=!!(p&&!p.tank&&bombs&&bombs.some(b=>b.own==='p'&&!(b.fly>0))),mode=truckMode?'truck':fighterMode?'fighter':tankMode?'tank':planted?'detonate':'human';
 if(mode!==lastActionMode){lastActionMode=mode;actionGlyph.textContent=truckMode?'×':'D';actionBtn.setAttribute('aria-label',truckMode?'攻撃不可':fighterMode?'爆撃':tankMode?'主砲':planted?'起爆':'爆弾');}
 const nextActionLabel=truckMode?'攻撃不可':fighterMode?'爆撃':tankMode?'主砲':planted?'起爆':'爆弾',nextSkillLabel=tankMode?'MG':fighterMode||truckMode?'—':(p&&p.drill>0?'突貫':SKN[skill]);
 if(nextActionLabel!==lastActionLabel){lastActionLabel=nextActionLabel;actionLabel.textContent=nextActionLabel;}
 if(nextSkillLabel!==lastSkillLabel){lastSkillLabel=nextSkillLabel;skillLabel.textContent=nextSkillLabel;}
 if((tankMode||fighterMode)&&p&&p.tank)paintRing(actionCooldown,Math.max(0,p.cc),p.tank.t.ccd);else paintRing(actionCooldown,0,1);
 if(tankMode&&p&&p.tank)paintRing(skillCooldown,Math.max(0,p.vc),Math.max(.01,p.tank.t.vcd));else if(!p?.tank){if(skill==='flame')paintRing(skillCooldown,Math.max(0,3-(p?.flameFuel||0)),3);else paintRing(skillCooldown,Math.max(0,p?.scd||0),Math.max(.01,p?.scdMax||1));}else paintRing(skillCooldown,0,1);
};
let actionAimPointer=null,actionAimStartX=0,actionAimStartY=0,skillAimPointer=null,skillAimStartX=0,skillAimStartY=0;
const updateTouchTurretAim=(e,sx,sy)=>{
 if(!p||!p.tank||p.tank.kind!=='tank')return false;
 const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.hypot(dx,dy)<7)return false;
 touchTurretAngle=Math.atan2(dy,dx);p.ang=touchTurretAngle;return true;
};
const actionDown=e=>{
 e.preventDefault();cap(actionBtn,e);actionBtn.classList.add('on');
 if(p&&p.tank&&p.tank.kind==='truck'){say('トラックは攻撃できない');actionKey=null;return;}
 if(p&&p.tank&&p.tank.kind==='tank'){
  // スマホ戦車: Dは照準スティック。ドラッグで砲塔旋回し、指を離した時だけ主砲を発射する。
  actionAimPointer=e.pointerId;actionAimStartX=e.clientX;actionAimStartY=e.clientY;actionKey=null;return;
 }

};
const finishAction=(e,fireTank)=>{
 if(e)e.preventDefault();
 const wasTankAim=actionAimPointer!==null&&(!e||e.pointerId===actionAimPointer);
 if(wasTankAim&&e)updateTouchTurretAim(e,actionAimStartX,actionAimStartY);
 if(wasTankAim&&fireTank&&p&&p.tank&&p.tank.kind==='tank')cannonReq=true;
 actionAimPointer=null;actionBtn.classList.remove('on');if(actionKey)release(actionKey);actionKey=null;
};
actionBtn.addEventListener('pointerdown',actionDown,{passive:false});
actionBtn.addEventListener('pointermove',e=>{if(actionAimPointer===e.pointerId){e.preventDefault();updateTouchTurretAim(e,actionAimStartX,actionAimStartY);}},{passive:false});
actionBtn.addEventListener('pointerup',e=>finishAction(e,true),{passive:false});
actionBtn.addEventListener('pointercancel',e=>finishAction(e,false),{passive:false});
actionBtn.addEventListener('lostpointercapture',e=>finishAction(e,false),{passive:false});
// スマホ戦車: SはMGを押下中ずっと発射。ドラッグ中は射撃しながら砲塔を旋回する。
skillBtn.addEventListener('pointerdown',e=>{if(p&&p.tank&&p.tank.kind==='tank'){skillAimPointer=e.pointerId;skillAimStartX=e.clientX;skillAimStartY=e.clientY;}},{passive:false});
skillBtn.addEventListener('pointermove',e=>{if(skillAimPointer===e.pointerId){e.preventDefault();updateTouchTurretAim(e,skillAimStartX,skillAimStartY);}},{passive:false});
const finishSkillAim=e=>{if(skillAimPointer!==null&&(!e||e.pointerId===skillAimPointer))skillAimPointer=null;};
skillBtn.addEventListener('pointerup',finishSkillAim,{passive:false});skillBtn.addEventListener('pointercancel',finishSkillAim,{passive:false});skillBtn.addEventListener('lostpointercapture',finishSkillAim,{passive:false});
syncActionButton();setInterval(syncActionButton,50);

const pad=document.getElementById('stick'),knob=document.getElementById('knob'),st={ArrowUp:0,ArrowDown:0,ArrowLeft:0,ArrowRight:0};let act=null;
function setDir(x,y){const m=.3,n={ArrowLeft:x<-m,ArrowRight:x>m,ArrowUp:y<-m,ArrowDown:y>m};for(const k in n)if(!!st[k]!==n[k]){st[k]=n[k]?1:0;n[k]?press(k):release(k);}}
function mvp(e){const r=pad.getBoundingClientRect();let dx=(e.clientX-r.left-r.width/2)/(r.width/2),dy=(e.clientY-r.top-r.height/2)/(r.height/2);const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l;}knob.style.transform='translate('+dx*(pad.clientWidth*.3)+'px,'+dy*(pad.clientHeight*.3)+'px)';setDir(dx,dy);}
pad.addEventListener('pointerdown',e=>{e.preventDefault();cap(pad,e);act=e.pointerId;mvp(e);},{passive:false});
pad.addEventListener('pointermove',e=>{if(act===e.pointerId){e.preventDefault();mvp(e);}},{passive:false});
const end=e=>{if(e)e.preventDefault();act=null;knob.style.transform='';setDir(0,0);};
pad.addEventListener('pointerup',end,{passive:false});pad.addEventListener('pointercancel',end,{passive:false});pad.addEventListener('lostpointercapture',end,{passive:false});

// 古いiOS向けフォールバック: Pointer Events がない場合もタップ開始だけは動かす。
if(!window.PointerEvent){
 cv.addEventListener('touchstart',e=>{const t=e.changedTouches[0];if(!t)return;e.preventDefault();const r=cv.getBoundingClientRect();mx=(t.clientX-r.left)*W/r.width;my=(t.clientY-r.top)*H/r.height;if(state==='title')handleTitlePointer(mx,my);else if(state==='help')handleHelpPointer(mx,my);else if(state==='skill'){handleSkillMenuPointer(mx,my);}else if(state==='win'||state==='lose'){handleResultPointer(mx,my);}},{passive:false});
}

const clearInputs=()=>{for(const k in keys)keys[k]=false;for(const k in st)st[k]=0;act=null;actionKey=null;actionAimPointer=null;skillAimPointer=null;touchTurretAngle=null;dPressHandled=false;bombReq=false;cannonReq=false;interact=false;skillReq=false;knob.style.transform='';document.querySelectorAll('[data-k]').forEach(el=>el.classList.remove('on'));actionBtn.classList.remove('on');mdown=false;};

const backToTitle=e=>{
 if(e){e.preventDefault();e.stopPropagation();}

 // 画面を戻すだけで新規マップを生成しない。旧実装ではここでreset()が走り、

 gameBuildGeneration++;state='title';gameBuildQueued=false;if(hound&&hound.target)hound.target.houndPinned=false;hound=null;houndTrail=[];
 debugMode=0;debugInvincible=false;updateDebugBadge();

};

document.addEventListener('visibilitychange',()=>{if(document.hidden)clearInputs();});
addEventListener('blur',clearInputs);
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

})();
